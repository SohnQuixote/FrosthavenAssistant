name: Windows Build

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: ./frosthaven_assistant

    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
      - run: flutter --version

      - name: Install dependencies
        run: flutter pub get

      - name: Enable Windows desktop
        run: flutter config --enable-windows-desktop

      - name: Build Windows release
        run: flutter build windows --release

      - name: Package build output
        shell: pwsh
        run: |
          $releaseDir = Get-ChildItem -Path build/windows -Recurse -Directory -Filter Release | Select-Object -First 1
          Compress-Archive -Path "$($releaseDir.FullName)/*" -DestinationPath FrosthavenAssistant-windows.zip

      - uses: actions/upload-artifact@v4
        with:
          name: FrosthavenAssistant-windows
          path: frosthaven_assistant/FrosthavenAssistant-windows.zip
          retention-days: 14
