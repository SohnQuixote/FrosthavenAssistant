name: Windows build

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: ./frosthaven_assistant

    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
      - run: flutter --version

      - name: Install dependencies
        run: flutter pub get

      - name: Windows build
        run: flutter build windows --release

      - name: Upload build
        uses: actions/upload-artifact@v4
        with:
          name: frosthaven-assistant-windows
          path: frosthaven_assistant/build/windows/x64/runner/Release/
